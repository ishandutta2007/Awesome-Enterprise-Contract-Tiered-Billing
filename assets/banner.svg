<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.25;
      stroke-width: 1;
    }
    .floating-orb {
      animation: floatOrb 8s ease-in-out infinite alternate;
    }
    .pulsing-wave {
      animation: pulseWave 4s ease-in-out infinite;
    }
    .pulse-node {
      animation: pulseNode 3s ease-in-out infinite alternate;
    }
    @keyframes floatOrb {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-25px) scale(1.15); opacity: 0.6; }
      100% { transform: translateY(15px) scale(0.95); opacity: 0.35; }
    }
    @keyframes pulseWave {
      0% { stroke-dashoffset: 0; opacity: 0.4; }
      50% { stroke-dashoffset: 150; opacity: 0.85; }
      100% { stroke-dashoffset: 300; opacity: 0.4; }
    }
    @keyframes pulseNode {
      0% { r: 5; opacity: 0.5; }
      100% { r: 9; opacity: 1; }
    }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tag-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Elements -->
  <g class="floating-orb" style="transform-origin: 200px 100px;">
    <circle cx="200" cy="100" r="160" fill="#6366f1" filter="url(#glow)" opacity="0.15" />
  </g>
  <g class="floating-orb" style="transform-origin: 1000px 300px; animation-delay: -3s;">
    <circle cx="1000" cy="300" r="180" fill="#ec4899" filter="url(#glow)" opacity="0.12" />
  </g>
  <g class="floating-orb" style="transform-origin: 850px 80px; animation-delay: -5s;">
    <circle cx="850" cy="80" r="140" fill="#06b6d4" filter="url(#glow)" opacity="0.16" />
  </g>

  <!-- Isometric/Perspective Grid Background Pattern -->
  <g opacity="0.4">
    <line x1="50" y1="350" x2="1150" y2="350" class="grid-line" />
    <line x1="100" y1="310" x2="1100" y2="310" class="grid-line" />
    <line x1="150" y1="270" x2="1050" y2="270" class="grid-line" />
    <line x1="200" y1="230" x2="1000" y2="230" class="grid-line" />
    <line x1="250" y1="190" x2="950" y2="190" class="grid-line" />

    <!-- Converging Perspective Lines -->
    <line x1="600" y1="150" x2="100" y2="380" class="grid-line" />
    <line x1="600" y1="150" x2="300" y2="380" class="grid-line" />
    <line x1="600" y1="150" x2="500" y2="380" class="grid-line" />
    <line x1="600" y1="150" x2="700" y2="380" class="grid-line" />
    <line x1="600" y1="150" x2="900" y2="380" class="grid-line" />
    <line x1="600" y1="150" x2="1100" y2="380" class="grid-line" />
  </g>

  <!-- Dynamic Step Billing Curve Visual (Bottom-right decoration) -->
  <g opacity="0.65">
    <path d="M 680 340 L 760 340 L 760 300 L 850 300 L 850 250 L 950 250 L 950 190 L 1060 190 L 1060 120 L 1140 120" 
          fill="none" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="10 5" class="pulsing-wave" filter="url(#glow)" />
    
    <!-- Tier Nodes -->
    <circle cx="760" cy="340" r="5" fill="#38bdf8" class="pulse-node" />
    <circle cx="850" cy="300" r="6" fill="#818cf8" class="pulse-node" style="animation-delay: -1s;" />
    <circle cx="950" cy="250" r="7" fill="#a855f7" class="pulse-node" style="animation-delay: -2s;" />
    <circle cx="1060" cy="190" r="6" fill="#ec4899" class="pulse-node" style="animation-delay: -1.5s;" />
    <circle cx="1140" cy="120" r="8" fill="#38bdf8" class="pulse-node" style="animation-delay: -0.5s;" />
  </g>

  <!-- Foreground Content: Pill Badge -->
  <g transform="translate(80, 75)">
    <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="16" cy="15" r="4" fill="#38bdf8" class="pulse-node" />
    <text x="30" y="20" class="tag-text">ENTERPRISE BILLING ECOSYSTEM</text>
  </g>

  <!-- Foreground Title -->
  <text x="80" y="155" class="title-text">Enterprise Contract &amp;</text>
  <text x="80" y="205" class="title-text" fill="url(#neonCyan)">Tiered Billing Architecture</text>

  <!-- Foreground Subtitle -->
  <text x="80" y="250" class="subtitle-text">Curated Directory of Scalable SaaS Platforms, High-Throughput Metering</text>
  <text x="80" y="275" class="subtitle-text">Engines, Rating Workflows &amp; Open-Source Monetization Infrastructure.</text>

  <!-- Feature Pill Tags -->
  <g transform="translate(80, 315)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="67" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ Tiered Pricing</text>
    
    <!-- Pill 2 -->
    <rect x="145" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="225" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">📊 Usage-Based Rating</text>

    <!-- Pill 3 -->
    <rect x="315" y="0" width="145" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="387" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">📜 Hybrid Contracts</text>

    <!-- Pill 4 -->
    <rect x="470" y="0" width="145" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="542" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🌐 Open Source Core</text>
  </g>
</svg>
