<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="neonCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><linearGradient id="purplePink" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="gridGlow" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes floatOrb{0%{transform:translateY(0) scale(1);opacity:.3}50%{transform:translateY(-25px) scale(1.15);opacity:.6}}@keyframes pulseWave{0%{stroke-dashoffset:0;opacity:.4}50%{stroke-dashoffset:150;opacity:.85}}@keyframes pulseNode{0%{r:5;opacity:.5}}.grid-line{stroke:#334155;stroke-opacity:.25;stroke-width:1}.floating-orb{animation:floatOrb 8s ease-in-out infinite alternate}.pulsing-wave{animation:pulseWave 4s ease-in-out infinite}.pulse-node{animation:pulseNode 3s ease-in-out infinite alternate}.subtitle-text,.tag-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:40px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:17px;fill:#94a3b8;letter-spacing:.2px}.tag-text{font-weight:600;font-size:12px;fill:#38bdf8;letter-spacing:.8px}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g class="floating-orb" style